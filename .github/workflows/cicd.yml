name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          cat > /tmp/creds.json <<'CREDEOF'
          ${{ secrets.STORAGE_CREDENTIALS }}
          CREDEOF
          python - <<'PYEOF'
          import json, os

          with open("/tmp/creds.json") as f:
              creds = json.load(f)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"AWS_ACCESS_KEY_ID={creds['aws_access_key_id']}\n")
              env.write(f"AWS_SECRET_ACCESS_KEY={creds['aws_secret_access_key']}\n")
              env.write("AWS_DEFAULT_REGION=ap-southeast-1\n")
          PYEOF

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv data/holdout.csv

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          f1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=$f1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          s3 = boto3.client("s3")
          s3.upload_file(
              "models/model.joblib",
              os.environ["ARTIFACT_BUCKET"],
              "artifacts/current/model.joblib",
          )
          print("Model uploaded to artifacts/current/model.joblib")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import os

          f1 = float(os.environ["F1"])   # output giữa các job là chuỗi
          threshold = 0.65
          if f1 < threshold:
              raise SystemExit(f"BLOCKED: f1_score={f1:.4f} < {threshold}")
          print(f"PASSED: f1_score={f1:.4f} >= {threshold}")
          PYEOF

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz || exit 1
            echo "Deploy OK"